[project]
name = "rag-eval-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rajendra Prasad Joshi", email = "rajendraprasadjoshi22@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "deepeval>=4.2.8",
    "dotenv>=0.9.9",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.29.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag-eval-project = "rag_eval_project:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
